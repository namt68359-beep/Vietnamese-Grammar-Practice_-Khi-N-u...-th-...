<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnamese Grammar Practice: Khi and Nếu… thì…</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8ff;--card:#fff;--ink:#16263d;--mute:#587090;--line:#d3e0f2;--blue:#1c6fe0;--blue2:#e3eeff;--sun:#ffc93c;--sunbg:#fff6d6;--ok:#137a45;--okbg:#dff4e8;--bad:#b3261e;--badbg:#fbe1de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2b;--card:#16263d;--ink:#e8f0fc;--mute:#9db4d3;--line:#2a4060;--blue:#6aa8ff;--blue2:#1d3556;--sunbg:#3a3216;--ok:#6fd39c;--okbg:#17372a;--bad:#ff8f86;--badbg:#3d1f1d}}
:root[data-theme="dark"]{--bg:#0e1a2b;--card:#16263d;--ink:#e8f0fc;--mute:#9db4d3;--line:#2a4060;--blue:#6aa8ff;--blue2:#1d3556;--sunbg:#3a3216;--ok:#6fd39c;--okbg:#17372a;--bad:#ff8f86;--badbg:#3d1f1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:18px;line-height:1.6}
main{max-width:820px;margin:0 auto;padding:24px 18px 64px}
h1{font-size:2.3rem;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:1.6rem;margin:0 0 10px}
h3{font-size:1.2rem;margin:0 0 6px}
.muted{color:var(--mute)}
.home{text-align:center;padding-top:20px}
.big{display:grid;gap:16px;grid-template-columns:1fr 1fr;margin:28px 0 16px}
.bigbtn{font:inherit;text-align:left;padding:24px;border:2px solid var(--blue);background:var(--card);color:var(--ink);border-radius:20px;cursor:pointer}
.bigbtn small{display:block;color:var(--blue);font-weight:800}
.bigbtn b{font-size:1.5rem;display:block}
.bigbtn:hover{background:var(--blue2)}
.bigbtn.wide{grid-column:1/3;border-color:var(--sun);text-align:center}
.bigbtn.wide small{color:var(--mute)}
@media (max-width:560px){.big{grid-template-columns:1fr}.bigbtn.wide{grid-column:auto}}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.back{font:inherit;font-size:.95rem;padding:8px 14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.steps button{font:inherit;font-size:.95rem;padding:8px 14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
[aria-selected=true]{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.vc{font:inherit;text-align:left;padding:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;cursor:pointer;min-height:100px}
.vc b{font-size:1.25rem;color:var(--blue)}
.vc.open{background:var(--blue2);border-color:var(--blue)}
.vc span{display:block;font-size:.92rem}
.vi{font-size:1.25rem;font-weight:600}
.en{display:block;color:var(--mute);font-size:1rem;font-weight:400}
.eq{font-size:1.5rem;font-weight:800;color:var(--blue);margin:10px 0}
.note{background:var(--sunbg);border-radius:14px;padding:14px 16px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:.85rem;font-weight:600;background:var(--blue2);color:var(--blue);border-radius:8px;padding:2px 10px;margin-bottom:6px}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.wrap{overflow-x:auto}
.prog{height:8px;background:var(--line);border-radius:4px;margin:8px 0 18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);transition:width .3s}
.q{font-size:1.5rem;font-weight:600;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opts button{font:inherit;text-align:left;padding:14px 18px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--blue)}
.opts button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opts button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
input[type=text]{font:inherit;font-size:1.3rem;padding:12px 16px;border:2px solid var(--line);border-radius:14px;width:180px;background:var(--card);color:var(--ink)}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--sunbg)}
.btn{font:inherit;font-weight:600;margin:14px 8px 0 0;padding:12px 24px;border:0;border-radius:14px;background:var(--blue);color:#fff;cursor:pointer}
.timer{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 16px}.timer i{display:block;height:100%;width:100%;background:var(--sun)}.say{font-size:1.9rem;font-weight:800;margin:6px 0 4px}.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.score{font-size:3rem;font-weight:800;color:var(--blue);margin:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const V=[
["khi","when","Khi tôi đói, tôi đi ăn.","When I'm hungry, I go get something to eat."],
["thức dậy","wake up","Tôi thức dậy lúc sáu giờ.","I wake up at six o'clock."],
["về đến nhà","get home","Tôi về đến nhà lúc năm giờ.","I get home at five."],
["đi làm","go to work","Tôi đi làm bằng xe máy.","I go to work by motorbike."],
["đến công ty","get to the office","Tôi đến công ty lúc tám giờ.","I get to the office at eight."],
["ăn cơm","eat a meal","Tôi ăn cơm với gia đình.","I eat a meal with my family."],
["đi ăn","go get something to eat","Tối nay tôi đi ăn phở.","Tonight I'm going to get pho."],
["uống cà phê","drink coffee","Tôi uống cà phê buổi sáng.","I drink coffee in the morning."],
["uống nước","drink water","Tôi uống nước mỗi ngày.","I drink water every day."],
["thay quần áo","change clothes","Tôi thay quần áo ở nhà.","I change clothes at home."],
["đi ngủ","go to bed","Tôi đi ngủ lúc mười giờ.","I go to bed at ten."],
["hỏi","ask","Tôi hỏi cô giáo.","I ask the teacher."],
["hiểu","understand","Tôi hiểu bài.","I understand the lesson."],
["nhớ","miss","Tôi nhớ bạn.","I miss you."],
["nhắn tin","text/message","Tôi nhắn tin cho bạn.","I text you."],
["trời mưa","it rains","Hôm nay trời mưa.","It's raining today."],
["đói","hungry","Tôi đói.","I'm hungry."],
["mệt","tired","Tôi mệt.","I'm tired."],
["buồn","sad","Hôm nay tôi buồn.","I'm sad today."],
["vui","happy","Tôi vui.","I'm happy."]];
const EX=[
["Morning","Khi tôi thức dậy, tôi thường uống một cốc nước.","When I wake up, I usually drink a glass of water."],
["Work","Khi tôi đến công ty, tôi thường uống cà phê.","When I get to the office, I usually drink coffee."],
["Getting home","Khi tôi về đến nhà, tôi thường thay quần áo.","When I get home, I usually change my clothes."],
["Food","Khi tôi đói, tôi đi ăn.","When I'm hungry, I go get something to eat."],
["Weather","Khi trời mưa, tôi thường ở nhà.","When it rains, I usually stay home."],
["Tired","Khi tôi mệt, tôi thường đi ngủ sớm.","When I'm tired, I usually go to bed early."],
["Missing someone","Khi tôi nhớ bạn, tôi thường nhắn tin cho bạn.","When I miss you, I usually text you."],
["Learning Vietnamese","Khi tôi không hiểu, tôi hỏi cô giáo.","When I don't understand, I ask my teacher."]];
const EX2=[
["Weather","Nếu trời mưa, tôi sẽ ở nhà.","If it rains, I'll stay home."],
["Weekend","Nếu trời đẹp, tôi sẽ đi công viên.","If the weather is nice, I'll go to the park."],
["Hungry","Nếu tôi đói, tôi sẽ đi ăn.","If I'm hungry, I'll go get something to eat."],
["Tired","Nếu tôi mệt, tôi sẽ nghỉ ở nhà.","If I'm tired, I'll rest at home."],
["Learning Vietnamese","Nếu tôi không hiểu, tôi sẽ hỏi cô giáo.","If I don't understand, I'll ask my teacher."],
["Free time","Nếu tôi có thời gian, tôi sẽ gặp bạn.","If I have time, I'll meet you."],
["Money","Nếu tôi có đủ tiền, tôi sẽ mua một chiếc điện thoại mới.","If I have enough money, I'll buy a new phone."]];
// [prompt, answer, explanation, translation, ...options]  (no options = typed)
const A1=[
["Khi tôi đói, tôi…","đi ăn","“Đói” means “hungry,” so “đi ăn” = “go eat.”","When I'm hungry, I go get something to eat.","đi ngủ","đi làm"],
["Khi trời mưa, tôi…","thường ở nhà","When it rains, staying home is the natural result.","When it rains, I usually stay home.","uống cà phê","đi ngủ sớm"],
["Khi tôi mệt, tôi…","đi ngủ","“Mệt” means “tired,” so you go to bed.","When I'm tired, I go to bed.","đi mua sắm","đi làm"],
["Khi tôi về đến nhà, tôi thường…","thay quần áo","After you get home, you change clothes. Going to work or school happens outside the home.","When I get home, I usually change my clothes.","đi làm","đi học"],
["Khi tôi không hiểu, tôi…","hỏi cô giáo","“Hỏi” = ask. When you don't understand, you ask the teacher.","When I don't understand, I ask my teacher.","đi ngủ","uống nước"]];
const A2=[
["______ tôi đói, tôi đi ăn.","khi","Hunger is a situation, and going to eat is what happens then.","When I'm hungry, I go get something to eat."],
["Tôi thường ở nhà ______ trời mưa.","khi","Khi can also come in the middle: B + khi + A.","I usually stay home when it rains."],
["______ tôi mệt, tôi thường đi ngủ sớm.","khi","“Thường” (usually) shows a habit, which fits khi.","When I'm tired, I usually go to bed early."],
["Tôi uống cà phê ______ tôi buồn ngủ.","khi","Khi links the situation (sleepy) to the action (coffee).","I drink coffee when I'm sleepy."],
["______ tôi về đến nhà, tôi thay quần áo.","khi","Getting home is the moment; changing clothes happens then.","When I get home, I change my clothes."],
["Tôi hỏi cô giáo ______ tôi không hiểu.","khi","B + khi + A: the situation comes second.","I ask the teacher when I don't understand."]];
const B1=[
["Nếu trời mưa, ______ tôi ở nhà.","thì","Thì marks the result after nếu. It can be omitted in daily speech.","If it rains, then I stay home."],
["______ tôi đói, tôi sẽ đi ăn.","nếu","Being hungry is a condition, and “sẽ” shows the result: use nếu.","If I'm hungry, I'll go get something to eat."],
["Nếu trời đẹp, tôi ______ đi công viên.","sẽ","Sẽ = will. It shows a plan or a possible result.","If the weather is nice, I'll go to the park."],
["Nếu bạn mệt, ______ bạn nghỉ đi.","thì","Thì introduces the result: “take a rest.”","If you're tired, take a rest."]];
const R=[
["______ tôi thức dậy, tôi uống nước.","Khi","Waking up happens every day, so it is a routine: khi.","Khi tôi thức dậy, tôi uống nước.","When I wake up, I drink water.","Nếu"],
["______ tôi có thời gian, tôi sẽ gặp bạn.","Nếu","You may or may not have time. It is a condition: nếu.","Nếu tôi có thời gian, tôi sẽ gặp bạn.","If I have time, I'll meet you.","Khi"],
["______ trời mưa, tôi thường ở nhà.","Khi","“Thường” (usually) shows a habit: khi.","Khi trời mưa, tôi thường ở nhà.","When it rains, I usually stay home.","Nếu"],
["______ trời đẹp, tôi sẽ đi dạo.","Nếu","“Sẽ” shows a plan that depends on the weather: nếu.","Nếu trời đẹp, tôi sẽ đi dạo.","If the weather is nice, I'll go for a walk.","Khi"],
["______ tôi không hiểu, tôi hỏi cô giáo.","Khi","A regular habit, no “sẽ”: khi. (Nếu … tôi sẽ hỏi would also be possible as a plan.)","Khi tôi không hiểu, tôi hỏi cô giáo.","When I don't understand, I ask my teacher.","Nếu"]];

const $=s=>document.querySelector(s);
const app=$("#app");
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const ex=(v,e)=>'<div class="card"><p class="vi">'+v+'<span class="en">'+e+'</span></p></div>';
const exCards=a=>a.map(x=>'<div class="card"><span class="tag">'+x[0]+'</span><p class="vi">'+x[1]+'<span class="en">'+x[2]+'</span></p></div>').join("");

function home(){
  app.innerHTML='<div class="home"><h1>🇻🇳 Vietnamese Grammar Practice</h1><h2>KHI… &amp; NẾU… THÌ…</h2><p class="muted"><b>A1–A2 Interactive Lesson</b></p><p>Learn how to talk about situations, habits, conditions, and possible results in Vietnamese.</p><div class="big"><button class="bigbtn" id="b1"><small>LESSON 1</small><b>KHI… = WHEN…</b></button><button class="bigbtn" id="b2"><small>LESSON 2</small><b>NẾU… THÌ… = IF… THEN…</b></button><button class="bigbtn wide" id="b3"><small>QUICK REVIEW</small><b>KHI vs. NẾU</b></button><button class="bigbtn wide" id="b4"><small>QUICK SPEAKING GAME</small><b>Say it out loud, fast!</b></button></div></div>';
  $("#b1").onclick=()=>lesson(L1);$("#b2").onclick=()=>lesson(L2);$("#b3").onclick=()=>lesson(L3);$("#b4").onclick=()=>lesson(L4);
}
function lesson(L,i=0){
  clearInterval(window.tmr);
  app.innerHTML='<div class="bar"><button class="back" id="hm">Home</button><h3 style="margin:0">'+L.title+'</h3></div><div class="steps" role="tablist">'+L.s.map((s,k)=>'<button role="tab" aria-selected="'+(k===i)+'" data-k="'+k+'">'+s[0]+'</button>').join("")+'</div><div id="body"></div><div id="nav"></div>';
  $("#hm").onclick=home;
  app.querySelectorAll(".steps button").forEach(b=>b.onclick=()=>lesson(L,+b.dataset.k));
  window.scrollTo(0,0);
  const s=L.s[i];
  if(typeof s[1]==="function")s[1]($("#body"));else $("#body").innerHTML=s[1];
  const nv=$("#nav");
  if(i<L.s.length-1)nv.innerHTML='<button class="btn" id="nx">Next: '+L.s[i+1][0]+'</button>',$("#nx").onclick=()=>lesson(L,i+1);
  else nv.innerHTML='<button class="btn alt" id="hm2">Back to Home</button>',$("#hm2").onclick=home;
}
function vocab(el){
  el.innerHTML='<p class="muted">Click a card to reveal the meaning and an example.</p><div class="grid">'+V.map((v,k)=>'<button class="vc" data-k="'+k+'"><b>'+v[0]+'</b></button>').join("")+'</div>';
  el.querySelectorAll(".vc").forEach(b=>b.onclick=()=>{
    const v=V[b.dataset.k],o=b.classList.toggle("open");
    b.innerHTML='<b>'+v[0]+'</b>'+(o?'<span>'+v[1]+'</span><span class="vi" style="font-size:1rem;margin-top:6px">'+v[2]+'<span class="en">'+v[3]+'</span></span>':"");
  });
}
function quiz(items,opts={}){
  return el=>{
    let i=0,sc=0;const miss=[];
    const draw=()=>{
      if(i>=items.length){
        el.innerHTML='<div class="card"><p class="muted">Your score</p><p class="score">'+sc+' / '+items.length+'</p><p>'+(sc===items.length?"Perfect! Well done.":sc>=items.length*.7?"Great work! Try again for a perfect score.":"Good effort. Review the explanations and try again.")+'</p>'+(miss.length?'<h3>Review</h3>'+miss.map(m=>'<p><b>'+m[0]+'</b><br>'+m[1]+'</p>').join(""):"")+'<button class="btn" id="rt">Try again</button></div>';
        $("#rt").onclick=()=>{i=0;sc=0;miss.length=0;draw()};return;
      }
      const it=items[i],typed=it.length===4&&!opts.mc;
      el.innerHTML='<div class="card"><p class="muted">Question '+(i+1)+' of '+items.length+'</p><div class="prog"><i style="width:'+(i/items.length*100)+'%"></i></div><p class="q"></p>'+(typed?'<input type="text" id="in" autocomplete="off" autocapitalize="none" aria-label="Your answer"> <button class="btn" id="ck">Check</button>':'<div class="opts"></div>')+'<div id="fb"></div></div>';
      const vi=typed?it[0].replace("______","<b>"+(it[0].startsWith("______")?it[1][0].toUpperCase()+it[1].slice(1):it[1])+"</b>"):(opts.mc?it[3]:it[0].replace(/…$/,"")+" <b>"+it[1]+"</b>.");
      const en=typed?it[3]:(opts.mc?it[4]:it[3]);
      $(".q").textContent=it[0];
      const fin=(good)=>{
        if(good)sc++;else miss.push([it[0],it[1]+": "+it[2]]);
        const fb=$("#fb");
        fb.innerHTML='<div class="fb"><b style="color:var(--'+(good?'ok':'bad')+')">'+(good?"Correct!":"Not quite. The answer is: "+it[1])+'</b><p class="vi" style="margin:8px 0 0;font-size:1.1rem">'+vi+'<span class="en">'+en+'</span></p><p style="margin:8px 0 0">'+it[2]+'</p></div>';
        const nb=document.createElement("button");nb.className="btn";nb.textContent=i+1<items.length?"Next question":"See results";
        nb.onclick=()=>{i++;draw()};fb.firstChild.appendChild(nb);nb.focus();
      };
      if(typed){
        const inp=$("#in");inp.focus();
        const chk=()=>{if(!inp.value.trim()||$("#ck").disabled)return;$("#ck").disabled=true;inp.disabled=true;fin(inp.value.trim().toLowerCase()===it[1].toLowerCase())};
        $("#ck").onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter")chk()};
      }else{
        const o=$(".opts"),ok=it[1],ch=opts.mc?it.slice(opts.mc):it.slice(4);
        shuf([ok,...ch]).forEach(x=>{
          const b=document.createElement("button");b.textContent=x;
          b.onclick=()=>{o.querySelectorAll("button").forEach(y=>{y.disabled=true;if(y.textContent===ok)y.classList.add("ok")});if(x!==ok)b.classList.add("no");fin(x===ok)};
          o.appendChild(b);
        });
      }
    };
    draw();
  };
}
const L1={title:"Lesson 1: KHI… = WHEN…",s:[
["Vocabulary",vocab],
["What is khi?",'<div class="card"><h2>KHI = WHEN</h2><p><b>Khi</b> means <b>“when.”</b></p><p>We use <b>khi</b> to talk about what happens when a situation or event happens.</p><div class="eq">WHEN A → B</div><p class="muted">A happens → B happens.</p></div>'+exCards([["Example","Khi tôi đói, tôi đi ăn.","When I'm hungry, I go get something to eat."],["Example","Khi trời mưa, tôi thường ở nhà.","When it rains, I usually stay home."],["Example","Khi tôi mệt, tôi thường đi ngủ sớm.","When I'm tired, I usually go to bed early."]])],
["Two patterns",'<div class="two"><div class="card"><span class="tag">Pattern 1</span><div class="eq">Khi + A, B</div><p class="vi">Khi tôi đói, tôi đi ăn.<span class="en">When I\'m hungry, I go get something to eat.</span></p></div><div class="card"><span class="tag">Pattern 2</span><div class="eq">B + khi + A</div><p class="vi">Tôi đi ăn khi tôi đói.<span class="en">I go get something to eat when I\'m hungry.</span></p></div></div><div class="note">Both patterns are correct and have the same basic meaning.</div>'],
["Real-life examples",exCards(EX)],
["Exercise 1: Choose",el=>{el.innerHTML='<h2>Choose the correct answer</h2><div id="q"></div>';quiz(A1,{sent:1})($("#q"))}],
["Exercise 2: Fill in",el=>{el.innerHTML='<h2>Complete the sentence</h2><p class="muted">Type the missing word: <b>khi</b></p><div id="q"></div>';quiz(A2)($("#q"))}]
]};
const L2={title:"Lesson 2: NẾU… THÌ… = IF… THEN…",s:[
["What is nếu… thì…?",'<div class="card"><h2>NẾU… THÌ… = IF… THEN…</h2><p><b>Nếu</b> means <b>“if.”</b></p><p><b>Thì</b> introduces the result.</p><p>We use <b>nếu… thì…</b> to talk about a condition and its possible result.</p><div class="eq">IF A → RESULT B</div><h3>Basic pattern</h3><div class="eq" style="font-size:1.2rem">Nếu + condition, thì + result.</div></div>'+exCards([["Example","Nếu trời mưa, thì tôi ở nhà.","If it rains, then I stay home."],["Example","Nếu tôi đói, thì tôi sẽ đi ăn.","If I'm hungry, I'll go get something to eat."],["Example","Nếu bạn mệt, thì bạn nghỉ đi.","If you're tired, take a rest."]])],
["Thì can be omitted",'<div class="card"><h2>“Thì” can be omitted</h2><p>In everyday Vietnamese, <b>thì</b> can often be omitted.</p></div><div class="two"><div class="card"><span class="tag">With thì</span><p class="vi">Nếu trời mưa, <b>thì</b> tôi ở nhà.<span class="en">If it rains, then I stay home.</span></p></div><div class="card"><span class="tag">Without thì</span><p class="vi">Nếu trời mưa, tôi ở nhà.<span class="en">If it rains, I stay home.</span></p></div></div><div class="note">Both are correct. As a beginner, learn the full pattern <b>Nếu A, thì B</b>, then drop <b>thì</b> when speaking.</div>'],
["Real-life examples",exCards(EX2)],
["Exercise: Fill in",el=>{el.innerHTML='<h2>Complete the sentence</h2><p class="muted">Type the missing word: <b>nếu</b>, <b>thì</b>, or <b>sẽ</b>.</p><div id="q"></div>';quiz(B1)($("#q"))}]
]};

function speak(list,how){
  return el=>{
    let q=shuf(list),i=0,done=0;const T=8;
    const draw=()=>{
      clearInterval(window.tmr);
      if(i>=q.length){el.innerHTML='<div class="card"><p class="muted">Round complete</p><p class="score">'+done+' / '+q.length+'</p><p>'+(done===q.length?"You said every one. Excellent!":"Good practice! Play again to say the rest faster.")+'</p><button class="btn" id="rp">Play again</button></div>';$("#rp").onclick=()=>{q=shuf(list);i=0;done=0;draw()};return}
      const it=q[i];
      el.innerHTML='<div class="card"><p class="muted">Card '+(i+1)+' of '+q.length+'</p><p class="muted">'+how+'</p><p class="say">'+it[0]+'</p><div class="timer"><i id="tb"></i></div><div id="ans"></div><button class="btn alt" id="sh">Show sample answer</button><button class="btn" id="ok">I said it!</button><button class="btn alt" id="sk">Skip</button></div>';
      let t=T;const tb=$("#tb");tb.style.transition="width "+T+"s linear";requestAnimationFrame(()=>requestAnimationFrame(()=>tb.style.width="0%"));
      window.tmr=setInterval(()=>{t--;if(t<=0){clearInterval(window.tmr);tb.style.background="var(--bad)"}},1000);
      $("#sh").onclick=()=>{$("#ans").innerHTML='<div class="fb"><p class="vi" style="margin:0">'+it[1]+'<span class="en">'+it[2]+'</span></p></div>'};
      $("#ok").onclick=()=>{done++;i++;draw()};
      $("#sk").onclick=()=>{i++;draw()};
    };
    draw();
  };
}
